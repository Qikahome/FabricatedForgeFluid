// FabricatedForgeFluid → Fabric (1.21.1) 独立流体库
// Forge/NeoForge 式流体体系在 Fabric 上的复刻：FluidType 驱动实体交互 + 自动渲染注册。
// 骨架参考 JsonThings-Fabric/FFF 1.20.1：loom 1.10.+ 钉版 + Porting Lib 整包 include。
plugins {
    id 'fabric-loom' version '1.10.+'
    id 'maven-publish'
}

group = project.property('group')
version = project.property('mod_version')

base {
    archivesName = 'FabricatedForgeFluid-1.21.1'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

repositories {
    maven {
        // hanbings 第三方代理：镜像 fabricmc/mavenCentral 等，缓解国外源过慢（若失效可移除）
        url project.findProperty('loom_libraries_base') ?: 'https://repository.hanbings.io/proxy/'
    }
    maven {
        url 'https://maven.aliyun.com/repository/public'
        content {
            includeGroupByRegex '.*'
        }
    }
    mavenCentral()
    maven {
        // Minecraft 运行库（text2speech 等 Mojang 专属，仅发布于官方库）
        url "https://libraries.minecraft.net/"
    }
    maven {
        url "https://maven.fabricmc.net/"
    }
    maven {
        // Porting Lib 发布仓库（1.20.1 稳定线 2.3.x）
        url "https://mvn.devos.one/releases"
        content {
            includeGroup "io.github.fabricators_of_create.Porting-Lib"
        }
    }
    maven {
        // Porting Lib 1.21.1 只有 beta 线（3.1.0-beta.x），发布在 devos snapshots 仓库
        url "https://mvn.devos.one/snapshots"
        content {
            includeGroup "io.github.fabricators_of_create.Porting-Lib"
        }
    }
    maven {
        // Porting Lib 模块的传递依赖（部分模块 → reach-entity-attributes）
        url "https://maven.jamieswhiteshirt.com/libs-release"
        content {
            includeGroup "com.jamieswhiteshirt"
        }
    }
    // parchment 数据（PL 1.21.1 dev 同款：1.21 版数据，1.21.1 无独立 parchment）
    maven {
        url "https://maven.parchmentmc.org"
        content {
            includeGroupByRegex 'org\\.parchmentmc.*'
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.property('minecraft_version')}"
    // mojmap + parchment 命名（parchment 用 1.21 数据）
    mappings loom.layered {
        officialMojangMappings()
        parchment "org.parchmentmc.data:parchment-${project.property('parchment_minecraft_version')}:${project.property('parchment_mappings_version')}@zip"
    }
    modImplementation "net.fabricmc:fabric-loader:${project.property('fabric_loader_version')}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.property('fabric_api_version')}"

    // Porting Lib 仅 include FFF 自身直接使用的最小模块集（jar-in-jar include）。
    // JsonThings 所需模块由 JsonThings 自己单独引用，不在本库内嵌。
    def portingLibVersion = project.property('porting_lib_version')
    def portingLibModules = [
            'fluids'
    ]
    portingLibModules.each { mod ->
        modImplementation(include("io.github.fabricators_of_create.Porting-Lib:${mod}:${portingLibVersion}"))
    }

    compileOnly 'org.jetbrains:annotations:24.0.1'

    // MixinExtras：@ModifyExpressionValue 等扩展注入（loom 不自动提供编译依赖）。
    // 运行时由 fabric-loader 内置的 mixinextras 提供，故仅需编译期注解类，避免版本冲突。
    compileOnly "io.github.llamalad7:mixinextras-common:0.5.0"
}

loom {
    accessWidenerPath = file("src/main/resources/fabricatedforgefluid.accesswidener")
    mixin {
        // 固定 refmap 名，不随 archivesName 变化；需与 fabricatedforgefluid.mixins.json 的 "refmap" 一致，
        // 否则发布环境（intermediary）按此名找不到映射文件而崩溃。
        defaultRefmapName = "fabricatedforgefluid.refmap.json"
    }

    runs {
        configureEach {
            runDir = 'run'
        }
        client {
            client()
        }
        server {
            server()
        }
    }
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// LGPL：再分发（含 jar-in-jar 内嵌）须随附版权与许可声明，故打进 jar 与 sources jar
tasks.named('jar', Jar) {
    from('LICENSE.txt') { into 'META-INF' }
}
tasks.named('sourcesJar', Jar) {
    from('LICENSE.txt') { into 'META-INF' }
}

publishing {
    publications {
        mavenFabric(MavenPublication) {
            artifactId = 'FabricatedForgeFluid-1.21.1'
            from components.java
        }
    }
    // 发布：由 .github/workflows/publish.yml 在 push 到 1.21.1 分支时触发（GitHub Packages）
    repositories {
        maven {
            name = "GitHubPackages"
            url = "https://maven.pkg.github.com/Qikahome/FabricatedForgeFluid"
            credentials {
                username = System.getenv("GITHUB_ACTOR")
                password = System.getenv("GITHUB_TOKEN")
            }
        }
    }
}
