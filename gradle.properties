# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
# This is required to provide enough memory for the Minecraft decompilation process.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

# ---- FabricatedForgeFluid (1.20.1) ----
# Forge 式流体系统在 Fabric 上的复刻库：FluidType 驱动的实体交互 + 自动渲染注册。
group = qikahome
mod_version = 1.1.2

minecraft_version = 1.20.1
fabric_loader_version = 0.17.2
fabric_api_version = 0.92.6+1.20.1
# Porting Lib：提供 Forge 的 FluidType（fluids 模块）等兼容层，按模块 include 整包
porting_lib_version = 2.3.13+1.20.1
# loom 版本写死在 build.gradle（插件版本必须是字面量）。1.20.1 钉 1.10.+，勿再升
parchment_minecraft_version = 1.20.1
parchment_mappings_version = 2023.09.03

# loom 下载源镜像（maven.fabricmc.net / minecraft 资源在国内过慢；hanbings 为第三方全量代理，若失效可注释）
loom_libraries_base=https://repository.hanbings.io/proxy/
