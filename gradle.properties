# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
# This is required to provide enough memory for the Minecraft decompilation process.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

# ---- FabricatedForgeFluid (1.21.1) ----
# Forge 式流体系统在 Fabric 上的复刻库：FluidType 驱动的实体交互 + 自动渲染注册。
group = qikahome
mod_version = 1.1.3

minecraft_version = 1.21.1
fabric_loader_version = 0.17.2
fabric_api_version = 0.116.1+1.21.1
# Porting Lib：提供 NeoForge 风格 FluidType（fluids 模块）等兼容层，按模块 include 整包。
# 注意 1.21.1 只有 beta 线（3.1.0-beta.x），发布在 devos 的 snapshots 仓库（releases 仓库仅 1.20.1 的 2.3.x）。
porting_lib_version = 3.1.0-beta.90+1.21.1
# loom 版本写死在 build.gradle（插件版本必须是字面量）。沿用 1.20.1 的 1.10.+ 与 Gradle 8.14
parchment_minecraft_version = 1.21
parchment_mappings_version = 2024.07.28

# loom 下载源镜像（maven.fabricmc.net / minecraft 资源在国内过慢；hanbings 为第三方全量代理，若失效可注释）
loom_libraries_base=https://repository.hanbings.io/proxy/
